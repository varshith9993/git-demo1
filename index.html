<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Directory — Search & Explore</title>
  <style>
    /* ---------- Reset / Basics ---------- */
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#9aa4b2;
      --accent:#6ee7b7;
      --glass: rgba(255,255,255,0.03);
      --radius:14px;
      --max-width:1100px;
      --gap:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg,#071226 0%, #07192b 100%);
      color:#e6eef6;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.35;
      padding:32px 18px;
      display:flex;
      justify-content:center;
    }

    .container{
      width:100%;
      max-width:var(--max-width);
    }

    header{
      display:flex;
      gap:16px;
      align-items:center;
      justify-content:space-between;
      margin-bottom:20px;
    }
    h1{
      margin:0;
      font-size:20px;
      letter-spacing:0.2px;
    }
    p.lead{
      margin:6px 0 0 0;
      color:var(--muted);
      font-size:13px;
    }

    /* Search bar */
    .search-wrap{
      display:flex;
      gap:12px;
      align-items:center;
      background:var(--glass);
      padding:8px;
      border-radius:12px;
      box-shadow: 0 6px 18px rgba(2,6,23,0.6);
      width:100%;
      max-width:700px;
    }
    .search-input{
      background:transparent;
      border:0;
      outline:0;
      color:inherit;
      font-size:15px;
      flex:1;
      padding:8px;
    }
    .search-meta{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .pill{
      background:rgba(255,255,255,0.03);
      color:var(--muted);
      padding:6px 10px;
      border-radius:999px;
      font-size:13px;
    }

    /* Grid of cards */
    main{
      margin-top:22px;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit,minmax(240px,1fr));
      gap:var(--gap);
    }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:var(--radius);
      padding:16px;
      min-height:120px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      box-shadow: 0 6px 18px rgba(2,6,23,0.5);
      transition: transform .18s ease, box-shadow .18s ease;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .card:focus-within,
    .card:hover{
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(1,8,20,0.6);
    }

    .logo{
      min-width:56px;
      height:56px;
      border-radius:10px;
      background:linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      font-size:14px;
      color:var(--accent);
      border: 1px solid rgba(255,255,255,0.03);
    }
    .body{
      flex:1;
      min-width:0;
    }
    .title-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin-bottom:6px;
    }
    .name{
      font-weight:600;
      font-size:15px;
      margin:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .type{
      font-size:12px;
      color:var(--muted);
      background:transparent;
      padding:3px 8px;
      border-radius:999px;
    }
    .desc{
      margin:6px 0 10px 0;
      color:var(--muted);
      font-size:13px;
      overflow:hidden;
      display:-webkit-box;
      -webkit-line-clamp:3;
      -webkit-box-orient:vertical;
    }
    .card-actions{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .btn{
      border:0;
      background:transparent;
      color:var(--accent);
      padding:8px 10px;
      cursor:pointer;
      border-radius:10px;
      font-weight:600;
      font-size:13px;
      text-decoration:none;
      outline: none;
      transition: background .12s ease;
    }
    .btn:hover{ background: rgba(110,231,183,0.06); }
    .small{ font-size:12px; color:var(--muted) }

    /* Empty / No results */
    .empty{
      text-align:center;
      margin:40px 0;
      color:var(--muted);
    }

    /* Responsive tweaks */
    @media (max-width:520px){
      header{flex-direction:column;align-items:flex-start;gap:12px}
      .search-wrap{width:100%}
    }
    .btn-about {
    background:#6ee7b7;
    color:#000;
    padding:8px 14px;
    border-radius:6px;
    text-decoration:none;
    font-weight:bold;
    margin-left:15px;
    }
    .btn-about:hover {
    opacity:0.8;
    }


    /* Accessibility focus */
    .card:focus-within{ outline: 2px solid rgba(110,231,183,0.12) }
    .search-input:focus{ outline:none }
  </style>
</head>
<body>
  <div class="container" role="main">
    <header>
      <div>
        <h1>AI Directory</h1>
        <p class="lead">Explore AI tools — search by name or description. Built with HTML/CSS/JS for VS Code.</p>
      </div>

      <div style="margin-left:auto;display:flex;gap:12px;align-items:center;">
        <div class="search-wrap" aria-label="Search AIs">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="opacity:.9">
            <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <input id="search" class="search-input" type="search" placeholder="Search AIs (name, description)..." aria-label="Search AI tools" />
          <div class="search-meta">
            <div class="pill" id="countPill">-- AIs</div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div id="grid" class="grid" aria-live="polite"></div>

      <div id="empty" class="empty" hidden>
        <p><strong>No results</strong> — try different keywords.</p>
      </div>
    </main>

    <footer style="margin-top:28px;color:var(--muted);font-size:13px;">
      Tip: click any card's "Visit" to open the official page (placeholder links in this demo).<a href="about.html" class="btn-about">About Us</a>
    </footer>

  </div>

  <script>
    // ---------- Data: list of AI tools ----------
    const aiList = [
      {
        id: 'chatgpt',
        name: 'ChatGPT',
        type: 'Conversational LLM',
        url: 'https://chat.openai.com/',
        description: 'OpenAI conversational assistant for text, code, and more. Great for chat, coding help, idea generation.'
      },
      {
        id: 'deepseek',
        name: 'DeepSeek',
        type: 'Search / Research',
        url: 'https://www.deepseek.com/en',
        description: 'Search-focused AI for exploring research, documents and summarisation.'
      },
      {
        id: 'qwen',
        name: 'Qwen',
        type: 'Large Language Model',
        url: 'https://chat.qwen.ai/',
        description: 'Qwen family of LLMs: capable of text generation and reasoning (placeholder link).'
      },
      {
        id: 'gemini',
        name: 'Gemini',
        type: 'Multimodal LLM',
        url: 'https://gemini.google.com/app?hl=en-IN',
        description: 'Google\'s multimodal model: text, image understanding and generation, multimodal reasoning.'
      },
      {
        id: 'gamma',
        name: 'Gamma',
        type: 'Presentation / Design AI',
        url: '#',
        description: 'AI for creating presentations, visuals and slides quickly from prompts and data.'
      },
      {
        id: 'presentationai',
        name: 'Presentation AI',
        type: 'Slides Generator',
        url: '#',
        description: 'Generate structured slide decks from an outline or text automatically.'
      },
      {
        id: 'elevenlabs',
        name: 'ElevenLabs',
        type: 'Text-to-Speech',
        url: 'https://elevenlabs.io/',
        description: 'High-quality text-to-speech voices. Useful for narration, podcasts, and voice generation.'
      },
      {
        id: 'leanardi',
        name: 'LeAnardi / Leanardi AI',
        type: 'Assistant / Research',
        url: '#',
        description: 'A placeholder entry — your custom or lesser-known AIs can be added here.'
      },
      {
        id: 'gpt-coder',
        name: 'Code Assist (example)',
        type: 'Coding Assistant',
        url: '#',
        description: 'Helpers focused on code generation, linting and suggestions.'
      },
      {
        id: 'manymore',
        name: 'Many More AIs',
        type: 'Collection',
        url: '#',
        description: 'Placeholder for additional AIs - extend the list by adding objects in the JS array.'
      }
    ];

    // ---------- Helpers ----------
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    const countPill = document.getElementById('countPill');
    const searchInput = document.getElementById('search');

    // Create an accessible card element
    function createCard(ai){
      const a = document.createElement('article');
      a.className = 'card';
      a.setAttribute('tabindex','0');
      a.setAttribute('aria-labelledby', 'title-'+ai.id);

      // logo area (initials)
      const logo = document.createElement('div');
      logo.className = 'logo';
      const initials = ai.name.split(' ').map(s => s[0]).slice(0,2).join('').toUpperCase();
      logo.textContent = initials;

      const body = document.createElement('div');
      body.className = 'body';

      const titleRow = document.createElement('div');
      titleRow.className = 'title-row';

      const title = document.createElement('h3');
      title.className = 'name';
      title.id = 'title-'+ai.id;
      title.textContent = ai.name;

      const type = document.createElement('div');
      type.className = 'type';
      type.textContent = ai.type;

      titleRow.appendChild(title);
      titleRow.appendChild(type);

      const desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = ai.description;

      const actions = document.createElement('div');
      actions.className = 'card-actions';

      const visit = document.createElement('a');
      visit.className = 'btn';
      visit.textContent = 'Visit';
      visit.href = ai.url || '#';
      visit.target = '_blank';
      visit.rel = 'noopener noreferrer';
      visit.setAttribute('aria-label', `Visit ${ai.name} official site`);

      const more = document.createElement('button');
      more.className = 'btn';
      more.textContent = 'Details';
      more.type = 'button';
      more.addEventListener('click', () => {
        alert(ai.name + "\\n\\n" + ai.type + "\\n\\n" + ai.description + "\\n\\nURL: " + ai.url);
      });

      actions.appendChild(visit);
      actions.appendChild(more);

      body.appendChild(titleRow);
      body.appendChild(desc);
      body.appendChild(actions);

      a.appendChild(logo);
      a.appendChild(body);
      return a;
    }

    // Renders the list into the grid (filtered array)
    function renderList(list){
      grid.innerHTML = '';
      if(!list.length){
        empty.hidden = false;
        countPill.textContent = '0 AIs';
        return;
      } else {
        empty.hidden = true;
      }
      countPill.textContent = list.length + (list.length === 1 ? ' AI' : ' AIs');
      const fragment = document.createDocumentFragment();
      for(const ai of list){
        fragment.appendChild(createCard(ai));
      }
      grid.appendChild(fragment);
    }

    // ---------- Search / Filter logic ----------
    // returns true if ai matches query
    function matches(ai, q){
      if(!q) return true;
      q = q.toLowerCase();
      return (
        ai.name.toLowerCase().includes(q) ||
        (ai.description && ai.description.toLowerCase().includes(q)) ||
        (ai.type && ai.type.toLowerCase().includes(q))
      );
    }

    // Debounce utility
    function debounce(fn, wait){
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), wait);
      };
    }

    // Handle input change (debounced)
    const onSearch = debounce(() => {
      const q = searchInput.value.trim();
      const filtered = aiList.filter(ai => matches(ai, q));
      renderList(filtered);
    }, 180);

    // init
    renderList(aiList);
    searchInput.addEventListener('input', onSearch);

    // Allow pressing Escape to clear search
    searchInput.addEventListener('keydown', (e) => {
      if(e.key === 'Escape'){
        searchInput.value = '';
        renderList(aiList);
      }
    });

    // Optional: expose a method to add new AI entries programmatically
    window.addAI = function(obj){
      if(!obj || !obj.name) return;
      aiList.push({
        id: obj.id || ('ai-' + Math.random().toString(36).slice(2,8)),
        name: obj.name,
        type: obj.type || 'Unknown',
        url: obj.url || '#',
        description: obj.description || ''
      });
      renderList(aiList);
    }

    // Accessibility: focus search on load for convenience
    window.addEventListener('load', () => {
      searchInput.focus();
    });

  </script>
</body>
</html>
